packages:
  - 'packages/*'
  - 'docs/'
  - 'packages/create-vike-core/boilerplate-*'
  - 'examples/*'
  - 'test/'
  - 'test/*'
  - 'test-deprecated-design/*'
  - '.github/workflows/ci'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  '@voidzero-dev/vite-plus': latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
